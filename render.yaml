# Render Blueprint: the STEM Saathi API server (AI tutor, numerical solver, login, natural voice)
# plus a PostgreSQL database for student accounts.
# Render → New → Blueprint → pick this repository. You will be asked for GROQ_API_KEY.
services:
  - type: web
    name: stem-saathi-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Secret: paste your Groq key in the Render dashboard (never commit it).
      - key: GROQ_API_KEY
        sync: false
      # Websites allowed to call this API (comma-separated).
      - key: ALLOWED_ORIGINS
        value: https://prishu2453.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: stem-saathi-db
          property: connectionString

databases:
  - name: stem-saathi-db
    plan: free
    region: singapore
